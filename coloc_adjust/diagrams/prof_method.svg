<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320"><style>svg{background:#fff} text{font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif}
.d-box{fill:#ffffff;stroke:#b9c1cd;stroke-width:1.4}.d-soft{fill:#eaf1fb;stroke:#2a78d6;stroke-width:1.2}.d-good{fill:#e7f5ee;stroke:#178a58;stroke-width:1.2}
.d-warn{fill:#fbf3dc;stroke:#9a6a00;stroke-width:1.2}.d-ten{fill:#fdeee6;stroke:#eb6834;stroke-width:1.2}.d-bad{fill:#fbecec;stroke:#cf3a3a;stroke-width:1.4}
.d-zone{fill:none;stroke:#b9c1cd;stroke-width:1.2;stroke-dasharray:5 4}
.d-t{fill:#18212f;font-size:13px}.d-s{fill:#18212f;font-size:12px}.d-b{fill:#18212f;font-size:14px;font-weight:600}.d-h{fill:#18212f;font-size:15.5px;font-weight:600}
.d-m{fill:#77818f;font-size:12px}.d-g{fill:#178a58;font-size:12.5px;font-weight:600}.d-r{fill:#cf3a3a;font-size:12.5px;font-weight:600}.d-ln{stroke:#465166;stroke-width:1.5;fill:none}</style><rect width="880" height="320" fill="#fff"/><defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#465166"/></marker></defs><text class="d-h" x="10.0" y="24.0">How the profile of a tenant step is measured</text><g transform="translate(0,40)"><rect class="d-ten" x="20" y="20" width="250" height="96" rx="6"/><text class="d-b" x="34.0" y="44.0">Tenant, alone, as it runs</text><text class="d-s" x="34.0" y="64.0">MPS, green context of 32 SMs</text><text class="d-s" x="34.0" y="82.0">at every checkpoint: wait for the</text><text class="d-s" x="34.0" y="98.0">GPU, then emit a mark (NVTX)</text><rect class="d-box" x="20" y="140" width="250" height="78" rx="6"/><text class="d-b" x="34.0" y="164.0">Nsight Systems, GPU metrics</text><text class="d-s" x="34.0" y="184.0">memory read and write throughput,</text><text class="d-s" x="34.0" y="200.0">10,000 samples a second, in %</text><rect class="d-soft" x="330" y="60" width="240" height="116" rx="6"/><text class="d-b" x="344.0" y="84.0">Per segment</text><text class="d-s" x="344.0" y="104.0">integrate the samples between</text><text class="d-s" x="344.0" y="120.0">two marks; average over the</text><text class="d-s" x="344.0" y="136.0">steps</text><text class="d-s" x="344.0" y="160.0">× GB/s per 1 %</text><rect class="d-box" x="330" y="200" width="240" height="62" rx="6"/><text class="d-b" x="344.0" y="224.0">Calibration</text><text class="d-s" x="344.0" y="244.0">copies of a 1 GiB tensor</text><rect class="d-good" x="630" y="60" width="230" height="116" rx="6"/><text class="d-b" x="644.0" y="84.0">Table of a step</text><text class="d-s" x="644.0" y="104.0">one row per segment:</text><text class="d-s" x="644.0" y="120.0">bytes read, bytes written,</text><text class="d-s" x="644.0" y="136.0">time, running total</text><rect class="d-box" x="630" y="200" width="230" height="62" rx="6"/><text class="d-b" x="644.0" y="224.0">Checks</text><text class="d-s" x="644.0" y="244.0">per-kernel counters; old counter</text><path d="M270 68H326" stroke="#465166" stroke-width="1.5" fill="none" marker-end="url(#arr)"/><path d="M270 180H300V130H326" stroke="#465166" stroke-width="1.5" fill="none" marker-end="url(#arr)"/><path d="M450 200V180" stroke="#465166" stroke-width="1.5" fill="none" marker-end="url(#arr)"/><path d="M570 118H626" stroke="#465166" stroke-width="1.5" fill="none" marker-end="url(#arr)"/><path d="M745 200V180" stroke="#465166" stroke-width="1.5" fill="none" marker-end="url(#arr)"/></g></svg>
