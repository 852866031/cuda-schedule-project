<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" role="img" aria-labelledby="c2-t"><style>svg{background:#fff} text{font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif}
.d-box{fill:#ffffff;stroke:#b9c1cd;stroke-width:1.4}.d-soft{fill:#eaf1fb;stroke:#2a78d6;stroke-width:1.2}.d-ten{fill:#fdeee6;stroke:#eb6834;stroke-width:1.2}
.d-bad{fill:#fbecec;stroke:#cf3a3a;stroke-width:1.4}.d-good{fill:#e7f5ee;stroke:#178a58;stroke-width:1.2}.d-warn{fill:#fbf3dc;stroke:#9a6a00;stroke-width:1.2}
.d-zone{fill:none;stroke:#b9c1cd;stroke-width:1.2;stroke-dasharray:5 4}.d-t{fill:#18212f;font-size:13px}.d-b{fill:#18212f;font-size:14px;font-weight:600}
.d-m{fill:#77818f;font-size:12px}.d-r{fill:#cf3a3a;font-size:12.5px;font-weight:600}.d-g{fill:#178a58;font-size:12.5px;font-weight:600}.d-ln{stroke:#465166;stroke-width:1.5;fill:none}</style><rect width="780" height="250" fill="#fff"/>
<title id="c2-t">A decode node has two states: requests running, or none. With requests running decode uses 75 to 79% of the path without gaps; the tenant's allowance is lifted only when no request is running</title>
<text class="d-b" x="10" y="44">Engine state</text><rect class="d-box" x="170" y="24" width="45" height="30" rx="5"/><text class="d-t" x="192.5" y="44" text-anchor="middle">idle</text><rect class="d-soft" x="215" y="24" width="385" height="30" rx="5"/><text class="d-t" x="407.5" y="44" text-anchor="middle">decode (the number of running requests varies; no gaps)</text><rect class="d-box" x="600" y="24" width="40" height="30" rx="5"/><text class="d-t" x="620.0" y="44" text-anchor="middle">idle</text><rect class="d-soft" x="640" y="24" width="120" height="30" rx="5"/><text class="d-t" x="700.0" y="44" text-anchor="middle">decode</text>
<text class="d-b" x="10" y="112">Path in use</text><text class="d-m" x="10" y="130">by decode</text><path class="d-ln" d="M170 140H760" style="stroke:#b9c1cd;stroke-width:1"/><rect x="217" y="93.8" width="381" height="46.2" style="fill:#2a78d6"/><text class="d-m" x="407.5" y="87.8" text-anchor="middle">75–79 %</text><rect x="642" y="93.8" width="116" height="46.2" style="fill:#2a78d6"/><text class="d-m" x="700.0" y="87.8" text-anchor="middle">75–79 %</text>
<text class="d-b" x="10" y="204">Tenant allowance</text><text class="d-m" x="10" y="222">the rule kept in C1</text><path class="d-ln" d="M170 226H760" style="stroke:#b9c1cd;stroke-width:1"/><rect x="172" y="186" width="41" height="40" style="fill:#eb6834"/><rect x="217" y="218" width="381" height="8" style="fill:#eb6834"/><rect x="602" y="186" width="36" height="40" style="fill:#eb6834"/><rect x="642" y="218" width="116" height="8" style="fill:#eb6834"/>
<text class="d-m" x="408" y="212" text-anchor="middle">requests running: the C1 allowance</text><text class="d-m" x="172" y="180">no request: lifted</text>
</svg>
