<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 302" width="790" height="302"><style>svg{background:#fff} text{font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif}
.d-box{fill:#ffffff;stroke:#b9c1cd;stroke-width:1.4}.d-soft{fill:#eaf1fb;stroke:#2a78d6;stroke-width:1.2}.d-good{fill:#e7f5ee;stroke:#178a58;stroke-width:1.2}
.d-warn{fill:#fbf3dc;stroke:#9a6a00;stroke-width:1.2}.d-ten{fill:#fdeee6;stroke:#eb6834;stroke-width:1.2}.d-bad{fill:#fbecec;stroke:#cf3a3a;stroke-width:1.4}
.d-zone{fill:none;stroke:#b9c1cd;stroke-width:1.2;stroke-dasharray:5 4}
.d-t{fill:#18212f;font-size:13px}.d-s{fill:#18212f;font-size:12px}.d-b{fill:#18212f;font-size:14px;font-weight:600}.d-h{fill:#18212f;font-size:15.5px;font-weight:600}
.d-m{fill:#77818f;font-size:12px}.d-g{fill:#178a58;font-size:12.5px;font-weight:600}.d-r{fill:#cf3a3a;font-size:12.5px;font-weight:600}.d-ln{stroke:#465166;stroke-width:1.5;fill:none}</style><rect width="790" height="302" fill="#fff"/><defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#465166"/></marker></defs><text class="d-h" x="10.0" y="24.0">Two test benches: the same tenant, a different decode side</text><g transform="translate(0,40)"><rect class="d-zone" x="10" y="6" width="376" height="248" rx="12"/><text class="d-b" x="24.0" y="30.0">Synthetic bench · GPU 1</text><rect class="d-soft" x="24" y="44" width="208" height="72" rx="8"/><text class="d-b" x="128.0" y="68.0" text-anchor="middle">Synthetic decode step</text><text class="d-m" x="128.0" y="88.0" text-anchor="middle">replays one Llama-3-8B step</text><text class="d-m" x="128.0" y="105.0" text-anchor="middle">138 SMs · batch 1 / 4 / 8</text><rect class="d-ten" x="242" y="44" width="130" height="72" rx="8"/><text class="d-b" x="307.0" y="68.0" text-anchor="middle">Tenant</text><text class="d-m" x="307.0" y="88.0" text-anchor="middle">LoRA fine-tune</text><text class="d-m" x="307.0" y="105.0" text-anchor="middle">32 SMs</text><path d="M128 116V136" stroke="#465166" stroke-width="1.5" fill="none" marker-end="url(#arr)"/><path d="M307 116V136" stroke="#465166" stroke-width="1.5" fill="none" marker-end="url(#arr)"/><rect class="d-bad" x="24" y="138" width="348" height="38" rx="8"/><text class="d-r" x="198.0" y="162.0" text-anchor="middle">path between the SMs and GPU memory · shared</text><rect class="d-box" x="24" y="194" width="348" height="50" rx="8"/><text class="d-t" x="198.0" y="215.0" text-anchor="middle">Measured: the time of every decode step</text><text class="d-m" x="198.0" y="234.0" text-anchor="middle">20 s per point, run forwards and backwards</text><rect class="d-zone" x="402" y="6" width="376" height="248" rx="12"/><text class="d-b" x="416.0" y="30.0">Real-engine bench · GPU 0</text><rect class="d-soft" x="416" y="44" width="208" height="72" rx="8"/><text class="d-b" x="520.0" y="68.0" text-anchor="middle">vLLM + kvcached</text><text class="d-m" x="520.0" y="88.0" text-anchor="middle">Llama-3-8B, real requests</text><text class="d-m" x="520.0" y="105.0" text-anchor="middle">11 minutes · 0.5–4 req/s</text><rect class="d-ten" x="634" y="44" width="130" height="72" rx="8"/><text class="d-b" x="699.0" y="68.0" text-anchor="middle">The same tenant</text><text class="d-m" x="699.0" y="88.0" text-anchor="middle">LoRA fine-tune</text><text class="d-m" x="699.0" y="105.0" text-anchor="middle">32 SMs</text><path d="M520 116V136" stroke="#465166" stroke-width="1.5" fill="none" marker-end="url(#arr)"/><path d="M699 116V136" stroke="#465166" stroke-width="1.5" fill="none" marker-end="url(#arr)"/><rect class="d-bad" x="416" y="138" width="348" height="38" rx="8"/><text class="d-r" x="590.0" y="162.0" text-anchor="middle">path between the SMs and GPU memory · shared</text><rect class="d-box" x="416" y="194" width="348" height="50" rx="8"/><text class="d-t" x="590.0" y="215.0" text-anchor="middle">Measured: each request's TPOT, token gaps</text><text class="d-m" x="590.0" y="234.0" text-anchor="middle">one run per scheme, against the engine alone</text></g></svg>
