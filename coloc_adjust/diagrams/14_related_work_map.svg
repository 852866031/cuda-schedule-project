<title id="rw-t">Existing work in five groups: splitting SMs does not isolate bandwidth; splitting the path isolates but is not usable on this card; kernel gating and LLM co-serving act indirectly; byte-rate budgets act directly but protect CPU tasks. C2 lands in kernel gating, C4 in LLM co-serving, C1 in byte rate</title>
<defs><marker id="rw-arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" style="fill:#465166"/></marker></defs>
<g id="rw-c1"><title>Split the SMs: MPS percentage, green contexts, LithOS. Bandwidth: no isolation. usable on this card</title><rect class="d-box" x="10" y="14" width="144" height="178" rx="10"/><text class="d-b" x="82" y="40" text-anchor="middle">Split the SMs</text><path class="d-ln" d="M22 52H142" style="stroke:#b9c1cd;stroke-width:1"/><text class="d-t" x="82" y="76" text-anchor="middle">MPS percentage</text><text class="d-t" x="82" y="96" text-anchor="middle">green contexts</text><text class="d-t" x="82" y="116" text-anchor="middle">LithOS</text><path class="d-ln" d="M22 128H142" style="stroke:#b9c1cd;stroke-width:1"/><text class="d-r" x="82" y="150" text-anchor="middle">no isolation</text><text class="d-m" x="82" y="174" text-anchor="middle">usable on this card</text></g><g id="rw-c2"><title>Split the path: MIG, Fractional GPUs, SGDRC. Bandwidth: isolates, static. not on this card</title><rect class="d-box" x="163" y="14" width="144" height="178" rx="10"/><text class="d-b" x="235" y="40" text-anchor="middle">Split the path</text><path class="d-ln" d="M175 52H295" style="stroke:#b9c1cd;stroke-width:1"/><text class="d-t" x="235" y="76" text-anchor="middle">MIG</text><text class="d-t" x="235" y="96" text-anchor="middle">Fractional GPUs</text><text class="d-t" x="235" y="116" text-anchor="middle">SGDRC</text><path class="d-ln" d="M175 128H295" style="stroke:#b9c1cd;stroke-width:1"/><text class="d-g" x="235" y="150" text-anchor="middle">isolates, static</text><text class="d-m" x="235" y="174" text-anchor="middle">not on this card</text></g><g id="rw-c3"><title>Gate kernels: Orion · Mosaic, Hummingbird, TGS · Tally. Bandwidth: indirect, by time. needs interception</title><rect class="d-box" x="316" y="14" width="144" height="178" rx="10"/><text class="d-b" x="388" y="40" text-anchor="middle">Gate kernels</text><path class="d-ln" d="M328 52H448" style="stroke:#b9c1cd;stroke-width:1"/><text class="d-t" x="388" y="76" text-anchor="middle">Orion · Mosaic</text><text class="d-t" x="388" y="96" text-anchor="middle">Hummingbird</text><text class="d-t" x="388" y="116" text-anchor="middle">TGS · Tally</text><path class="d-ln" d="M328 128H448" style="stroke:#b9c1cd;stroke-width:1"/><text class="d-t" x="388" y="150" text-anchor="middle">indirect, by time</text><text class="d-m" x="388" y="174" text-anchor="middle">needs interception</text></g><g id="rw-c4"><title>LLM co-serving: LLMStation, FlexLLM · ConServe, Nexus. Bandwidth: indirect, by latency. usable on this card</title><rect class="d-box" x="469" y="14" width="144" height="178" rx="10"/><text class="d-b" x="541" y="40" text-anchor="middle">LLM co-serving</text><path class="d-ln" d="M481 52H601" style="stroke:#b9c1cd;stroke-width:1"/><text class="d-t" x="541" y="76" text-anchor="middle">LLMStation</text><text class="d-t" x="541" y="96" text-anchor="middle">FlexLLM · ConServe</text><text class="d-t" x="541" y="116" text-anchor="middle">Nexus</text><path class="d-ln" d="M481 128H601" style="stroke:#b9c1cd;stroke-width:1"/><text class="d-t" x="541" y="150" text-anchor="middle">indirect, by latency</text><text class="d-m" x="541" y="174" text-anchor="middle">usable on this card</text></g><g id="rw-c5"><title>Byte rate: MemGuard, BWLOCK++, Ripple. Bandwidth: direct. protects CPU tasks</title><rect class="d-warn" x="622" y="14" width="144" height="178" rx="10"/><text class="d-b" x="694" y="40" text-anchor="middle">Byte rate</text><path class="d-ln" d="M634 52H754" style="stroke:#b9c1cd;stroke-width:1"/><text class="d-t" x="694" y="76" text-anchor="middle">MemGuard</text><text class="d-t" x="694" y="96" text-anchor="middle">BWLOCK++</text><text class="d-t" x="694" y="116" text-anchor="middle">Ripple</text><path class="d-ln" d="M634 128H754" style="stroke:#b9c1cd;stroke-width:1"/><text class="d-g" x="694" y="150" text-anchor="middle">direct</text><text class="d-m" x="694" y="174" text-anchor="middle">protects CPU tasks</text></g>
