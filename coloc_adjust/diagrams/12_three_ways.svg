<title id="gv-t">Three ways to hold the tenant to the same work: fewer SMs and running all the time; enough SMs with a pause after each step; the same work in small slices</title>
<rect x="170" y="18" width="14" height="12" style="fill:#eb6834"/><text class="d-m" x="190" y="29">the tenant's GPU-memory traffic</text>
