<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 390" width="790" height="390"><style>svg{background:#fff} text{font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif}
.d-box{fill:#ffffff;stroke:#b9c1cd;stroke-width:1.4}.d-soft{fill:#eaf1fb;stroke:#2a78d6;stroke-width:1.2}.d-good{fill:#e7f5ee;stroke:#178a58;stroke-width:1.2}
.d-warn{fill:#fbf3dc;stroke:#9a6a00;stroke-width:1.2}.d-ten{fill:#fdeee6;stroke:#eb6834;stroke-width:1.2}.d-bad{fill:#fbecec;stroke:#cf3a3a;stroke-width:1.4}
.d-zone{fill:none;stroke:#b9c1cd;stroke-width:1.2;stroke-dasharray:5 4}
.d-t{fill:#18212f;font-size:13px}.d-s{fill:#18212f;font-size:12px}.d-b{fill:#18212f;font-size:14px;font-weight:600}.d-h{fill:#18212f;font-size:15.5px;font-weight:600}
.d-m{fill:#77818f;font-size:12px}.d-g{fill:#178a58;font-size:12.5px;font-weight:600}.d-r{fill:#cf3a3a;font-size:12.5px;font-weight:600}.d-ln{stroke:#465166;stroke-width:1.5;fill:none}</style><rect width="790" height="390" fill="#fff"/><defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#465166"/></marker></defs><text class="d-h" x="10.0" y="24.0">The route of this report</text><g transform="translate(0,40)"><rect class="d-soft" x="10" y="10" width="210" height="84" rx="8"/><text class="d-b" x="22.0" y="32.0">Starting point</text><text class="d-m" x="22.0" y="52.0">decode pays for the tenant's bytes;</text><text class="d-m" x="22.0" y="70.0">an SM limit controls them weakly</text><rect class="d-warn" x="260" y="10" width="240" height="84" rx="8"/><text class="d-b" x="272.0" y="32.0">BWS: schedule its bandwidth</text><text class="d-m" x="272.0" y="52.0">a GB/s allowance for the tenant;</text><text class="d-m" x="272.0" y="70.0">it runs, then pauses</text><rect class="d-good" x="540" y="10" width="240" height="84" rx="8"/><text class="d-b" x="552.0" y="32.0">BWS-Budget, conclusion</text><text class="d-m" x="552.0" y="52.0">decode's cost halves (about 6 %),</text><text class="d-m" x="552.0" y="70.0">the tail disappears</text><path d="M220 52H258" stroke="#465166" stroke-width="1.5" fill="none" marker-end="url(#arr)"/><path d="M500 52H538" stroke="#465166" stroke-width="1.5" fill="none" marker-end="url(#arr)"/><rect class="d-box" x="260" y="108" width="240" height="50" rx="8"/><text class="d-b" x="272.0" y="130.0">BWS-Budget-Slicing</text><text class="d-m" x="272.0" y="146.0">nothing more on the vLLM engine</text><rect class="d-box" x="540" y="108" width="240" height="50" rx="8"/><text class="d-b" x="552.0" y="130.0">SLO-aware BWS</text><text class="d-m" x="552.0" y="146.0">holds the SLO target, too careful</text><path d="M660 156V176H115V190" stroke="#465166" stroke-width="1.5" fill="none" marker-end="url(#arr)"/><text class="d-m" x="388.0" y="171.0" text-anchor="middle">with the limit in place decode is still about 6 % slower</text><rect class="d-soft" x="10" y="192" width="210" height="84" rx="8"/><text class="d-b" x="22.0" y="214.0">What is left to lower</text><text class="d-m" x="22.0" y="234.0">the allowance cannot go to zero;</text><text class="d-m" x="22.0" y="252.0">each token has to cost less</text><rect class="d-warn" x="260" y="192" width="240" height="84" rx="8"/><text class="d-b" x="272.0" y="214.0">BWR: reduce its bandwidth</text><text class="d-m" x="272.0" y="234.0">the same training, fewer bytes;</text><text class="d-m" x="272.0" y="252.0">compiled: 41 % fewer per token</text><rect class="d-good" x="540" y="192" width="240" height="84" rx="8"/><text class="d-b" x="552.0" y="214.0">BWR-Compile, conclusion</text><text class="d-m" x="552.0" y="234.0">at the same tenant work, decode</text><text class="d-m" x="552.0" y="252.0">is down to about 4 %; needs BWS</text><path d="M220 234H258" stroke="#465166" stroke-width="1.5" fill="none" marker-end="url(#arr)"/><path d="M500 234H538" stroke="#465166" stroke-width="1.5" fill="none" marker-end="url(#arr)"/><rect class="d-box" x="260" y="290" width="240" height="50" rx="8"/><text class="d-b" x="272.0" y="312.0">Shapes with offload</text><text class="d-m" x="272.0" y="328.0">cost more than their bytes</text><rect class="d-box" x="540" y="290" width="240" height="50" rx="8"/><text class="d-b" x="552.0" y="312.0">The floor</text><text class="d-m" x="552.0" y="328.0">3–5 % even with no bytes moved</text></g></svg>
