<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 164" width="790" height="164"><style>svg{background:#fff} text{font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif}
.d-box{fill:#ffffff;stroke:#b9c1cd;stroke-width:1.4}.d-soft{fill:#eaf1fb;stroke:#2a78d6;stroke-width:1.2}.d-good{fill:#e7f5ee;stroke:#178a58;stroke-width:1.2}
.d-warn{fill:#fbf3dc;stroke:#9a6a00;stroke-width:1.2}.d-ten{fill:#fdeee6;stroke:#eb6834;stroke-width:1.2}.d-bad{fill:#fbecec;stroke:#cf3a3a;stroke-width:1.4}
.d-zone{fill:none;stroke:#b9c1cd;stroke-width:1.2;stroke-dasharray:5 4}
.d-t{fill:#18212f;font-size:13px}.d-s{fill:#18212f;font-size:12px}.d-b{fill:#18212f;font-size:14px;font-weight:600}.d-h{fill:#18212f;font-size:15.5px;font-weight:600}
.d-m{fill:#77818f;font-size:12px}.d-g{fill:#178a58;font-size:12.5px;font-weight:600}.d-r{fill:#cf3a3a;font-size:12.5px;font-weight:600}.d-ln{stroke:#465166;stroke-width:1.5;fill:none}</style><rect width="790" height="164" fill="#fff"/><defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#465166"/></marker></defs><text class="d-h" x="10.0" y="24.0">Why a job that moves no bytes still slows decode: three causes, each seen on its own</text><g transform="translate(0,40)"><rect class="d-box" x="10" y="6" width="250" height="112" rx="10"/><text class="d-b" x="24.0" y="30.0">Kernel launches</text><path d="M24 40H246" stroke="#b9c1cd" stroke-width="1" fill="none"/><text class="d-m" x="24.0" y="60.0">about 100 k launches/s of 16 KB each</text><text class="d-m" x="24.0" y="79.0">clock unchanged, under the power limit</text><text class="d-r" x="24.0" y="106.0">decode +3–5 %</text><rect class="d-box" x="272" y="6" width="250" height="112" rx="10"/><text class="d-b" x="286.0" y="30.0">The power limit</text><path d="M286 40H508" stroke="#b9c1cd" stroke-width="1" fill="none"/><text class="d-m" x="286.0" y="60.0">arithmetic on 32 SMs</text><text class="d-m" x="286.0" y="79.0">card at 500 W, clock down 2–7 %</text><text class="d-r" x="286.0" y="106.0">decode +4–10 %</text><rect class="d-box" x="534" y="6" width="250" height="112" rx="10"/><text class="d-b" x="548.0" y="30.0">The shared cache</text><path d="M548 40H770" stroke="#b9c1cd" stroke-width="1" fill="none"/><text class="d-m" x="548.0" y="60.0">64-MB working set next to 8 requests</text><text class="d-m" x="548.0" y="79.0">counter 6–8 % above decode's own traffic</text><text class="d-r" x="548.0" y="106.0">decode +5–7 %</text></g></svg>
