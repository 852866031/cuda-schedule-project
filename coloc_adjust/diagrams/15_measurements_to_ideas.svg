<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300"><style>svg{background:#fff} text{font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif}
.d-box{fill:#ffffff;stroke:#b9c1cd;stroke-width:1.4}.d-soft{fill:#eaf1fb;stroke:#2a78d6;stroke-width:1.2}.d-good{fill:#e7f5ee;stroke:#178a58;stroke-width:1.2}
.d-warn{fill:#fbf3dc;stroke:#9a6a00;stroke-width:1.2}.d-t{fill:#18212f;font-size:13px}.d-b{fill:#18212f;font-size:14px;font-weight:600}
.d-m{fill:#77818f;font-size:12px}.d-g{fill:#178a58;font-size:12.5px;font-weight:600}.d-r{fill:#cf3a3a;font-size:12.5px;font-weight:600}.d-ln{stroke:#465166;stroke-width:1.5;fill:none}</style><rect width="780" height="300" fill="#fff"/><defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#465166"/></marker></defs><rect class="d-soft" x="10" y="12" width="300" height="86" rx="8"/><text class="d-b" x="24" y="36">Stage 3: what to control</text><text class="d-t" x="24" y="60">decode's cost follows the tenant's bytes</text><text class="d-t" x="24" y="82">an SM limit is indirect and weak</text><rect class="d-good" x="10" y="110" width="300" height="108" rx="8"/><text class="d-b" x="24" y="134">Stage 2: how to control it</text><text class="d-t" x="24" y="158">decode is at baseline while it pauses</text><text class="d-t" x="24" y="180">cost grows with the time it runs</text><text class="d-t" x="24" y="202">cheapest per token on 16–64 SMs</text><path class="d-ln" d="M310 55C335 55 335 92 358 96" marker-end="url(#arr)"/><path class="d-ln" d="M310 164C335 164 335 140 358 136" marker-end="url(#arr)"/><rect class="d-warn" x="360" y="36" width="230" height="160" rx="8"/><text class="d-b" x="374" y="62">C1 byte budget</text><text class="d-t" x="374" y="88">quantity: GB per second</text><text class="d-t" x="374" y="112">means: run, then pause</text><text class="d-t" x="374" y="136">SMs: enough, 16–32</text><text class="d-t" x="374" y="160">allowance: steady</text><text class="d-m" x="374" y="182">two methods · measured Nov 16</text><path class="d-ln" d="M590 116H636" marker-end="url(#arr)"/><rect class="d-good" x="638" y="76" width="132" height="80" rx="8"/><text class="d-b" x="704" y="102" text-anchor="middle">Measured</text><text class="d-m" x="704" y="122" text-anchor="middle">decode cost halved</text><text class="d-m" x="704" y="140" text-anchor="middle">no tail</text><text class="d-m" x="10" y="238">another idea, the finer method of C1, and one idea that the measurements rule out</text><rect class="d-warn" x="10" y="246" width="246" height="46" rx="8"/><text class="d-b" x="22" y="266" style="font-size:13px">C2 a tenant that uses less</text><text class="d-m" x="22" y="284">same work, fewer bytes moved</text><rect class="d-warn" x="267" y="246" width="246" height="46" rx="8"/><text class="d-b" x="279" y="266" style="font-size:13px">C1, finer method</text><text class="d-m" x="279" y="284">one burst spans about 30 decode steps</text><rect class="d-box" x="524" y="246" width="246" height="46" rx="8"/><text class="d-b" x="536" y="266" style="font-size:13px">Timing: not pursued</text><text class="d-m" x="536" y="284">no gaps between decode steps</text></svg>
