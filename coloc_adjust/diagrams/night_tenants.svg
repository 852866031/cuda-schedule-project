<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 262" width="880" height="262"><style>svg{background:#fff} text{font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif}
.d-box{fill:#ffffff;stroke:#b9c1cd;stroke-width:1.4}.d-soft{fill:#eaf1fb;stroke:#2a78d6;stroke-width:1.2}.d-good{fill:#e7f5ee;stroke:#178a58;stroke-width:1.2}
.d-warn{fill:#fbf3dc;stroke:#9a6a00;stroke-width:1.2}.d-ten{fill:#fdeee6;stroke:#eb6834;stroke-width:1.2}.d-bad{fill:#fbecec;stroke:#cf3a3a;stroke-width:1.4}
.d-zone{fill:none;stroke:#b9c1cd;stroke-width:1.2;stroke-dasharray:5 4}
.d-t{fill:#18212f;font-size:13px}.d-s{fill:#18212f;font-size:12px}.d-b{fill:#18212f;font-size:14px;font-weight:600}.d-h{fill:#18212f;font-size:15.5px;font-weight:600}
.d-m{fill:#77818f;font-size:12px}.d-g{fill:#178a58;font-size:12.5px;font-weight:600}.d-r{fill:#cf3a3a;font-size:12.5px;font-weight:600}.d-ln{stroke:#465166;stroke-width:1.5;fill:none}</style><rect width="880" height="262" fill="#fff"/><defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#465166"/></marker></defs><text class="d-h" x="10.0" y="24.0">The three changes to the tenant, alone on 32 SMs: data per step, largest piece that cannot be paused, speed</text><g transform="translate(0,40)"><text class="d-m" x="360.0" y="18.0">GB per step</text><text class="d-m" x="654.0" y="18.0" text-anchor="end">largest piece</text><text class="d-m" x="750.0" y="18.0" text-anchor="end">MB per token</text><text class="d-m" x="856.0" y="18.0" text-anchor="end">tokens/s, alone</text><text class="d-s" x="350.0" y="49.0" text-anchor="end">usual tenant</text><rect x="360.0" y="34.0" width="63.1" height="20.0" rx="3" fill="#2a78d6"/><rect x="424.1" y="34.0" width="80.7" height="20.0" rx="3" fill="#eb6834"/><text class="d-b" x="510.8" y="49.0">57.2</text><text class="d-b" x="654.0" y="49.0" text-anchor="end" style="fill:#cf3a3a">7.97 GB</text><text class="d-s" x="750.0" y="49.0" text-anchor="end">13.95</text><text class="d-s" x="856.0" y="49.0" text-anchor="end">11,511</text><text class="d-s" x="350.0" y="79.0" text-anchor="end">change one: output layer over vocabulary blocks of 4,096</text><rect x="360.0" y="64.0" width="65.1" height="20.0" rx="3" fill="#2a78d6"/><rect x="426.1" y="64.0" width="22.6" height="20.0" rx="3" fill="#eb6834"/><text class="d-b" x="454.7" y="79.0">35.0</text><text class="d-s" x="654.0" y="79.0" text-anchor="end">0.18 GB</text><text class="d-s" x="750.0" y="79.0" text-anchor="end">8.54</text><text class="d-s" x="856.0" y="79.0" text-anchor="end">9,975</text><text class="d-s" x="350.0" y="109.0" text-anchor="end">changes one + two: and every layer compiled on its own</text><rect x="360.0" y="94.0" width="46.6" height="20.0" rx="3" fill="#2a78d6"/><rect x="407.6" y="94.0" width="23.5" height="20.0" rx="3" fill="#eb6834"/><text class="d-b" x="437.1" y="109.0">28.1</text><text class="d-s" x="654.0" y="109.0" text-anchor="end">0.13 GB</text><text class="d-s" x="750.0" y="109.0" text-anchor="end">6.86</text><text class="d-s" x="856.0" y="109.0" text-anchor="end">10,984</text><text class="d-s" x="350.0" y="139.0" text-anchor="end">changes one + two + three: and fused kernels (new tenant)</text><rect x="360.0" y="124.0" width="46.4" height="20.0" rx="3" fill="#2a78d6"/><rect x="407.4" y="124.0" width="8.0" height="20.0" rx="3" fill="#eb6834"/><text class="d-b" x="421.4" y="139.0">21.9</text><text class="d-s" x="654.0" y="139.0" text-anchor="end">0.12 GB</text><text class="d-s" x="750.0" y="139.0" text-anchor="end">5.34</text><text class="d-s" x="856.0" y="139.0" text-anchor="end">11,555</text><text class="d-s" x="350.0" y="169.0" text-anchor="end">for reference: compiled as a whole (Nov 16)</text><rect x="360.0" y="154.0" width="87.1" height="20.0" rx="3" fill="#7a5bd0"/><text class="d-b" x="453.1" y="169.0">34.4</text><text class="d-b" x="654.0" y="169.0" text-anchor="end" style="fill:#cf3a3a">8.58 GB</text><text class="d-s" x="750.0" y="169.0" text-anchor="end">8.39</text><text class="d-s" x="856.0" y="169.0" text-anchor="end">14,294</text><rect x="200.0" y="196.0" width="12.0" height="10.0" rx="3" fill="#2a78d6"/><text class="d-m" x="218.0" y="205.0">the 24 layers and the rest</text><rect x="390.0" y="196.0" width="12.0" height="10.0" rx="3" fill="#eb6834"/><text class="d-m" x="408.0" y="205.0">output layer and loss</text><rect x="550.0" y="196.0" width="12.0" height="10.0" rx="3" fill="#7a5bd0"/><text class="d-m" x="568.0" y="205.0">cannot be told apart (no place to pause)</text></g></svg>
