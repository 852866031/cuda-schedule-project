<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" role="img" aria-labelledby="pm-t"><style>svg{background:#fff} text{font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif}
.d-box{fill:#ffffff;stroke:#b9c1cd;stroke-width:1.4}.d-soft{fill:#eaf1fb;stroke:#2a78d6;stroke-width:1.2}.d-ten{fill:#fdeee6;stroke:#eb6834;stroke-width:1.2}
.d-bad{fill:#fbecec;stroke:#cf3a3a;stroke-width:1.4}.d-good{fill:#e7f5ee;stroke:#178a58;stroke-width:1.2}.d-warn{fill:#fbf3dc;stroke:#9a6a00;stroke-width:1.2}
.d-zone{fill:none;stroke:#b9c1cd;stroke-width:1.2;stroke-dasharray:5 4}.d-t{fill:#18212f;font-size:13px}.d-b{fill:#18212f;font-size:14px;font-weight:600}
.d-m{fill:#77818f;font-size:12px}.d-r{fill:#cf3a3a;font-size:12.5px;font-weight:600}.d-g{fill:#178a58;font-size:12.5px;font-weight:600}.d-ln{stroke:#465166;stroke-width:1.5;fill:none}</style><rect width="780" height="330" fill="#fff"/>
<title id="pm-t">Where the steps attach: C1 at the budget file and at the pause after a step, C2 at the engine's shared page, C3 at the tenant's choice of shape, C4 at the block-boundary hooks</title>
<defs><marker id="pm-arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" style="fill:#465166"/></marker></defs>
<g id="pm-eng"><title>The inference engine, running decode</title><rect class="d-soft" x="14" y="40" width="176" height="58" rx="8"/><text class="d-b" x="102" y="64" text-anchor="middle">Inference engine</text><text class="d-m" x="102" y="83" text-anchor="middle">vLLM · decode</text></g>
<g id="pm-sch"><title>The VRAM scheduler sets the KV limit and the tenant's budget from arrival rate and TPOT</title><rect class="d-box" x="250" y="40" width="190" height="58" rx="8"/><text class="d-b" x="345" y="64" text-anchor="middle">VRAM scheduler</text><text class="d-m" x="345" y="83" text-anchor="middle">reads load and TPOT</text></g>
<path class="d-ln" d="M190 69H248" marker-end="url(#pm-arr)"/><text class="d-m" x="219" y="60" text-anchor="middle">TPOT</text>
<g id="pm-page"><title>The page the engine writes: it has a busy flag; C2 lets the tenant lift its allowance when no request is running</title><rect class="d-box" x="14" y="150" width="176" height="96" rx="8"/><text class="d-b" x="102" y="174" text-anchor="middle">Shared page</text><text class="d-t" x="102" y="196" text-anchor="middle">busy flag</text><text class="d-t" x="80" y="222" text-anchor="middle" style="fill:#9a6a00">+ lift when idle</text><rect class="d-warn" x="146" y="208" width="36" height="20" rx="10"/><text class="d-b" x="164" y="223" text-anchor="middle" style="font-size:12.5px">C2</text></g>
<path class="d-ln" d="M102 98V148" marker-end="url(#pm-arr)"/>
<g id="pm-bud"><title>The budget file the scheduler writes: memory bytes, SM count and a tok/s cap exist; C1 adds a GB/s allowance</title><rect class="d-box" x="250" y="150" width="190" height="96" rx="8"/><text class="d-b" x="345" y="174" text-anchor="middle">Budget file</text><text class="d-m" x="345" y="196" text-anchor="middle">bytes · SMs · tok/s cap</text><text class="d-t" x="322" y="222" text-anchor="middle" style="fill:#9a6a00">+ GB/s allowance</text><rect class="d-warn" x="394" y="208" width="36" height="20" rx="10"/><text class="d-b" x="412" y="223" text-anchor="middle" style="font-size:12.5px">C1</text></g>
<path class="d-ln" d="M345 98V148" marker-end="url(#pm-arr)"/>
<path class="d-ln" d="M440 198H488" marker-end="url(#pm-arr)"/>
<path class="d-ln" d="M102 246V290H488" marker-end="url(#pm-arr)"/><text class="d-m" x="296" y="283" text-anchor="middle">what the engine is doing now</text>
<rect class="d-zone" x="490" y="14" width="280" height="306" rx="12"/><text class="d-b" x="630" y="36" text-anchor="middle">Tenant training loop</text>
<g id="pm-shape"><title>Choice of shape: today by GPU-memory budget only; C3 also counts the bytes moved per token</title><rect class="d-ten" x="504" y="46" width="252" height="56" rx="8"/><text class="d-t" x="514" y="68">Pick shape by memory budget</text><text class="d-t" x="514" y="90" style="fill:#9a6a00">+ count bytes per token</text><rect class="d-warn" x="712" y="76" width="36" height="20" rx="10"/><text class="d-b" x="730" y="91" text-anchor="middle" style="font-size:12.5px">C3</text></g>
<g id="pm-step"><title>One step: 24 blocks, forward and backward. Hooks at block boundaries exist; C4 adds a byte bucket there</title><rect class="d-ten" x="504" y="112" width="252" height="98" rx="8"/><text class="d-t" x="514" y="134">One step ≈ 216 ms (96 SMs)</text><rect class="d-box" x="514" y="144" width="232" height="56" rx="6"/><text class="d-t" x="524" y="165">24 blocks × forward, backward</text><text class="d-t" x="524" y="187" style="fill:#9a6a00">hooks exist + byte bucket</text><rect class="d-warn" x="702" y="173" width="36" height="20" rx="10"/><text class="d-b" x="720" y="188" text-anchor="middle" style="font-size:12.5px">C4</text></g>
<g id="pm-pause"><title>Pause after a step: today from a tok/s cap; C1 computes it from GB/s divided by bytes per token</title><rect class="d-ten" x="504" y="220" width="252" height="88" rx="8"/><text class="d-t" x="514" y="242">Pause after a step</text><text class="d-m" x="514" y="262">exists: from a tok/s cap</text><text class="d-t" x="514" y="286" style="fill:#9a6a00">+ GB/s ÷ bytes per token</text><rect class="d-warn" x="712" y="272" width="36" height="20" rx="10"/><text class="d-b" x="730" y="287" text-anchor="middle" style="font-size:12.5px">C1</text></g>
</svg>
