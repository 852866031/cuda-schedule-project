<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .subtitle { font: 500 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526076; }
      .heading { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .body { font: 500 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243047; }
      .small { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526076; }
      .label { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; letter-spacing: .4px; }
      .box { fill: #ffffff; stroke: #aab5c7; stroke-width: 2; rx: 14; }
      .shared { fill: #eef4ff; stroke: #5f83c7; stroke-width: 2.5; rx: 14; }
      .hb { fill: #eefaf5; stroke: #3d9c78; stroke-width: 2.5; rx: 14; }
      .tally { fill: #fff5e9; stroke: #d88932; stroke-width: 2.5; rx: 14; }
      .hp { fill: #d84c4c; stroke: #b63838; stroke-width: 2; rx: 10; }
      .be { fill: #547dcc; stroke: #3e61a5; stroke-width: 2; rx: 8; }
      .idle { fill: #f3f5f8; stroke: #c0c8d4; stroke-width: 2; stroke-dasharray: 8 6; rx: 8; }
      .arrow { stroke: #718096; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .line { stroke: #8d99aa; stroke-width: 2.5; fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#718096"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#fbfcfe"/>
  <text x="800" y="55" text-anchor="middle" class="title">A Unified View of Hummingbird and Tally</text>
  <text x="800" y="87" text-anchor="middle" class="subtitle">Transparent temporal sharing: turn best-effort kernels into bounded execution units, fill high-priority gaps, and yield quickly</text>

  <rect x="65" y="120" width="1470" height="205" class="shared"/>
  <rect x="85" y="140" width="230" height="32" rx="16" fill="#5f83c7"/>
  <text x="200" y="163" text-anchor="middle" class="label">SHARED CONTROL LOOP</text>

  <rect x="85" y="205" width="240" height="78" class="box"/>
  <text x="205" y="237" text-anchor="middle" class="heading">INTERCEPT</text>
  <text x="205" y="265" text-anchor="middle" class="small">observe HP and BE launches</text>
  <path d="M325 244 H380" class="arrow"/>

  <rect x="380" y="205" width="240" height="78" class="box"/>
  <text x="500" y="237" text-anchor="middle" class="heading">DIVIDE</text>
  <text x="500" y="265" text-anchor="middle" class="small">create bounded BE units</text>
  <path d="M620 244 H675" class="arrow"/>

  <rect x="675" y="205" width="240" height="78" class="box"/>
  <text x="795" y="237" text-anchor="middle" class="heading">HARVEST</text>
  <text x="795" y="265" text-anchor="middle" class="small">fill an HP-idle interval</text>
  <path d="M915 244 H970" class="arrow"/>

  <rect x="970" y="205" width="240" height="78" class="box"/>
  <text x="1090" y="237" text-anchor="middle" class="heading">YIELD</text>
  <text x="1090" y="265" text-anchor="middle" class="small">stop admission and drain</text>
  <path d="M1210 244 H1265" class="arrow"/>

  <rect x="1265" y="205" width="240" height="78" class="box"/>
  <text x="1385" y="237" text-anchor="middle" class="heading">RESUME</text>
  <text x="1385" y="265" text-anchor="middle" class="small">continue in the next bubble</text>

  <path d="M800 325 V365 H410 V395" class="arrow"/>
  <path d="M800 365 H1190 V395" class="arrow"/>

  <rect x="65" y="395" width="710" height="325" class="hb"/>
  <rect x="85" y="415" width="205" height="34" rx="17" fill="#3d9c78"/>
  <text x="187" y="439" text-anchor="middle" class="label">HUMMINGBIRD PATH</text>
  <text x="100" y="490" class="heading">Bubble-aware split-kernel scheduling</text>
  <text x="100" y="530" class="body"><tspan font-weight="700">SPLIT</tspan><tspan dx="8">— profile sub-grid size and inject block-index offsets.</tspan></text>
  <text x="100" y="575" class="body"><tspan font-weight="700">DETECT</tspan><tspan dx="8">— identify CUDA/NCCL bubbles and predict long gaps.</tspan></text>
  <text x="100" y="620" class="body"><tspan font-weight="700">PACE &amp; YIELD</tspan><tspan dx="8">— keep one split ahead; stop new launches on HP arrival.</tspan></text>
  <text x="100" y="665" class="small"><tspan font-weight="700">ADAPT:</tspan><tspan dx="8">consolidate splits in long bubbles; offload BE memory.</tspan></text>

  <rect x="825" y="395" width="710" height="325" class="tally"/>
  <rect x="845" y="415" width="145" height="34" rx="17" fill="#d88932"/>
  <text x="917" y="439" text-anchor="middle" class="label">TALLY PATH</text>
  <text x="860" y="490" class="heading">Profile-guided block-level yield</text>
  <text x="860" y="530" class="body"><tspan font-weight="700">VIRTUALIZE</tspan><tspan dx="8">— centralize CUDA interception and scheduling.</tspan></text>
  <text x="860" y="575" class="body"><tspan font-weight="700">CHOOSE</tspan><tspan dx="8">— profile each kernel: slicing or persistent workers.</tspan></text>
  <text x="860" y="620" class="body"><tspan font-weight="700">YIELD</tspan><tspan dx="8">— stop slices or set a device-visible preemption flag.</tspan></text>
  <text x="860" y="665" class="small"><tspan font-weight="700">RESUME:</tspan><tspan dx="8">continue persistent work from saved logical-block progress.</tspan></text>

  <text x="85" y="765" class="heading">Common GPU timeline</text>
  <text x="85" y="799" class="small">HP active</text>
  <rect x="190" y="778" width="280" height="34" class="hp"/>
  <text x="330" y="802" text-anchor="middle" class="label">HIGH PRIORITY</text>
  <rect x="470" y="778" width="370" height="34" class="idle"/>
  <rect x="840" y="778" width="300" height="34" class="hp"/>
  <text x="990" y="802" text-anchor="middle" class="label">HIGH PRIORITY</text>
  <rect x="1140" y="778" width="355" height="34" class="idle"/>

  <text x="85" y="850" class="small">BE harvest</text>
  <rect x="190" y="829" width="280" height="34" class="idle"/>
  <rect x="478" y="829" width="82" height="34" class="be"/>
  <rect x="568" y="829" width="82" height="34" class="be"/>
  <rect x="658" y="829" width="82" height="34" class="be"/>
  <rect x="748" y="829" width="82" height="34" class="be"/>
  <rect x="840" y="829" width="300" height="34" class="idle"/>
  <rect x="1148" y="829" width="104" height="34" class="be"/>
  <rect x="1260" y="829" width="104" height="34" class="be"/>
  <rect x="1372" y="829" width="104" height="34" class="be"/>
  <path d="M830 820 V870" stroke="#d84c4c" stroke-width="3"/>
  <text x="830" y="892" text-anchor="middle" class="small">bounded drain, then HP runs</text>
</svg>
