<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="340" viewBox="0 0 1600 340">
  <defs>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .step { font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20304b; }
      .desc { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #56657a; }
      .box { fill: #f2f6ff; stroke: #6687c5; stroke-width: 2.5; rx: 16; }
      .arrow { stroke: #718096; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#718096"/>
    </marker>
  </defs>

  <rect width="1600" height="340" fill="#fbfcfe"/>
  <text x="800" y="52" text-anchor="middle" class="title">Shared Cooperative-Preemption Control Loop</text>

  <rect x="55" y="100" width="250" height="130" class="box"/>
  <text x="180" y="145" text-anchor="middle" class="step">INTERCEPT</text>
  <text x="180" y="178" text-anchor="middle" class="desc">Observe HP arrivals</text>
  <text x="180" y="202" text-anchor="middle" class="desc">and control BE launches</text>
  <path d="M305 165 H365" class="arrow"/>

  <rect x="365" y="100" width="250" height="130" class="box"/>
  <text x="490" y="145" text-anchor="middle" class="step">DIVIDE</text>
  <text x="490" y="178" text-anchor="middle" class="desc">Create bounded</text>
  <text x="490" y="202" text-anchor="middle" class="desc">BE execution units</text>
  <path d="M615 165 H675" class="arrow"/>

  <rect x="675" y="100" width="250" height="130" class="box"/>
  <text x="800" y="145" text-anchor="middle" class="step">HARVEST</text>
  <text x="800" y="178" text-anchor="middle" class="desc">Place BE units inside</text>
  <text x="800" y="202" text-anchor="middle" class="desc">an HP-idle interval</text>
  <path d="M925 165 H985" class="arrow"/>

  <rect x="985" y="100" width="250" height="130" class="box"/>
  <text x="1110" y="145" text-anchor="middle" class="step">YIELD</text>
  <text x="1110" y="178" text-anchor="middle" class="desc">Stop new BE admission</text>
  <text x="1110" y="202" text-anchor="middle" class="desc">and drain one unit</text>
  <path d="M1235 165 H1295" class="arrow"/>

  <rect x="1295" y="100" width="250" height="130" class="box"/>
  <text x="1420" y="145" text-anchor="middle" class="step">RESUME</text>
  <text x="1420" y="178" text-anchor="middle" class="desc">Continue unfinished BE</text>
  <text x="1420" y="202" text-anchor="middle" class="desc">in the next HP bubble</text>

  <path d="M1420 230 V285 H180 V240" class="arrow"/>
  <text x="800" y="316" text-anchor="middle" class="desc">Repeat while preserving the HP latency/SLO bound</text>
</svg>
