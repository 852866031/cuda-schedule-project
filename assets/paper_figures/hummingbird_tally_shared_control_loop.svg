<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <style>
      .title { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .app { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .step { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20304b; }
      .note { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667389; }
      .hp { fill: #d94c4c; stroke: #b63838; stroke-width: 2.5; rx: 14; }
      .be { fill: #537dcb; stroke: #3e61a5; stroke-width: 2.5; rx: 14; }
      .box { fill: #f2f6ff; stroke: #6687c5; stroke-width: 2.5; rx: 14; }
      .arrow { stroke: #718096; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .guide { stroke: #b7c1d2; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#718096"/>
    </marker>
  </defs>

  <rect width="600" height="900" fill="#fbfcfe"/>
  <text x="300" y="42" text-anchor="middle" class="title">Shared Control Loop</text>

  <rect x="45" y="75" width="220" height="65" class="hp"/>
  <text x="155" y="115" text-anchor="middle" class="app">HP APPLICATION</text>
  <rect x="335" y="75" width="220" height="65" class="be"/>
  <text x="445" y="115" text-anchor="middle" class="app">BE APPLICATION</text>

  <path d="M155 140 V175 H300" class="guide"/>
  <path d="M445 140 V175 H300" class="guide"/>
  <path d="M300 175 V205" class="arrow"/>

  <rect x="150" y="205" width="300" height="72" class="box"/>
  <text x="300" y="249" text-anchor="middle" class="step">INTERCEPT</text>
  <path d="M300 277 V325" class="arrow"/>

  <rect x="150" y="325" width="300" height="72" class="box"/>
  <text x="300" y="369" text-anchor="middle" class="step">DIVIDE</text>
  <path d="M300 397 V445" class="arrow"/>

  <rect x="150" y="445" width="300" height="72" class="box"/>
  <text x="300" y="489" text-anchor="middle" class="step">HARVEST</text>
  <path d="M300 517 V565" class="arrow"/>

  <rect x="150" y="565" width="300" height="72" class="box"/>
  <text x="300" y="609" text-anchor="middle" class="step">YIELD</text>
  <path d="M300 637 V685" class="arrow"/>

  <rect x="150" y="685" width="300" height="72" class="box"/>
  <text x="300" y="729" text-anchor="middle" class="step">RESUME</text>

  <path d="M150 721 H85 V481 H140" class="arrow"/>
  <text x="66" y="605" text-anchor="middle" class="note" transform="rotate(-90 66 605)">next HP bubble</text>

  <text x="300" y="825" text-anchor="middle" class="note">Maximize BE progress subject to the HP latency/SLO bound</text>
</svg>
