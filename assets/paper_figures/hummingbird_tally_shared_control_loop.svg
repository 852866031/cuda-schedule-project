<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1050" viewBox="0 0 1100 1050">
  <defs>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .app { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .step { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20304b; }
      .desc { font: 500 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435168; }
      .note { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667389; }
      .hp { fill: #d94c4c; stroke: #b63838; stroke-width: 2.5; rx: 15; }
      .be { fill: #537dcb; stroke: #3e61a5; stroke-width: 2.5; rx: 15; }
      .box { fill: #f2f6ff; stroke: #6687c5; stroke-width: 2.5; rx: 15; }
      .arrow { stroke: #718096; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .guide { stroke: #c2cada; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#718096"/>
    </marker>
  </defs>

  <rect width="1100" height="1050" fill="#fbfcfe"/>
  <text x="550" y="52" text-anchor="middle" class="title">Shared Cooperative-Preemption Control Loop</text>

  <rect x="120" y="90" width="300" height="72" class="hp"/>
  <text x="270" y="135" text-anchor="middle" class="app">HP APPLICATION</text>
  <rect x="500" y="90" width="300" height="72" class="be"/>
  <text x="650" y="135" text-anchor="middle" class="app">BE APPLICATION</text>

  <path d="M270 162 V195 H460" class="guide"/>
  <path d="M650 162 V195 H460" class="guide"/>
  <path d="M460 195 V230" class="arrow"/>

  <rect x="310" y="230" width="300" height="78" class="box"/>
  <text x="460" y="278" text-anchor="middle" class="step">INTERCEPT</text>
  <path d="M460 308 V360" class="arrow"/>
  <path d="M610 269 H665" class="guide"/>
  <text x="690" y="259" class="desc">Observe HP arrivals and</text>
  <text x="690" y="287" class="desc">control BE kernel launches.</text>

  <rect x="310" y="360" width="300" height="78" class="box"/>
  <text x="460" y="408" text-anchor="middle" class="step">DIVIDE</text>
  <path d="M460 438 V490" class="arrow"/>
  <path d="M610 399 H665" class="guide"/>
  <text x="690" y="389" class="desc">Convert each BE kernel into</text>
  <text x="690" y="417" class="desc">bounded execution units.</text>

  <rect x="310" y="490" width="300" height="78" class="box"/>
  <text x="460" y="538" text-anchor="middle" class="step">HARVEST</text>
  <path d="M460 568 V620" class="arrow"/>
  <path d="M610 529 H665" class="guide"/>
  <text x="690" y="519" class="desc">Run BE units while the HP</text>
  <text x="690" y="547" class="desc">application has no GPU work.</text>

  <rect x="310" y="620" width="300" height="78" class="box"/>
  <text x="460" y="668" text-anchor="middle" class="step">YIELD</text>
  <path d="M460 698 V750" class="arrow"/>
  <path d="M610 659 H665" class="guide"/>
  <text x="690" y="649" class="desc">On HP arrival, stop new BE</text>
  <text x="690" y="677" class="desc">admission and drain one unit.</text>

  <rect x="310" y="750" width="300" height="78" class="box"/>
  <text x="460" y="798" text-anchor="middle" class="step">RESUME</text>
  <path d="M610 789 H665" class="guide"/>
  <text x="690" y="779" class="desc">Continue unfinished BE work</text>
  <text x="690" y="807" class="desc">in the next HP-idle interval.</text>

  <path d="M310 789 H205 V529 H300" class="arrow"/>
  <text x="185" y="675" text-anchor="middle" class="note" transform="rotate(-90 185 675)">repeat across HP bubbles</text>

  <rect x="120" y="900" width="780" height="92" rx="16" fill="#eef4ff" stroke="#9badd0" stroke-width="2"/>
  <text x="510" y="938" text-anchor="middle" class="desc">Goal: maximize useful BE execution while keeping</text>
  <text x="510" y="969" text-anchor="middle" class="desc">HP waiting time within its latency/SLO bound.</text>
</svg>
